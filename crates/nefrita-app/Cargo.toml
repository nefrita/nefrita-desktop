[package]
name = "nefrita-app"
version = "0.1.0"
description = "Desktop app for the Nefrita hardware wallet"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nefrita-device = { path = "../nefrita-device" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }

[dev-dependencies]
serde_json = "1.0.154"
ts-rs = "12.0.1"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
