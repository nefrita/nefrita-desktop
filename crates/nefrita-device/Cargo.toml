[package]
name = "nefrita-device"
version = "0.1.0"
description = "Client for the Nefrita hardware wallet over USB serial and TCP"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
minicbor = { version = "2.3.1", features = ["std"] }
minicbor-serde = { version = "0.7.2", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.154"
