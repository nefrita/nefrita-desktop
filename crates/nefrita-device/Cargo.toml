[package]
name = "nefrita-device"
version = "0.1.0"
description = "Client for the Nefrita hardware wallet over USB serial and TCP"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
minicbor = { version = "2.3.1", features = ["std"] }
minicbor-serde = { version = "0.7.2", features = ["std"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum"] }
serde = { version = "1.0.229", features = ["derive"] }
ureq = { version = "3.5.0", default-features = false, features = ["json", "platform-verifier", "rustls-no-provider"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
serde_json = "1.0.154"
