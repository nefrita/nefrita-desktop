name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all --check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install the WebKitGTK development package
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev

      - name: Run clippy with all features
        run: cargo clippy --workspace --all-targets --all-features --locked -- --deny warnings

      - name: Run clippy with default features
        run: cargo clippy --workspace --all-targets --locked -- --deny warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install the WebKitGTK development package
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev

      - name: Run tests
        run: cargo test --workspace --all-features --locked

  app-build:
    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install the WebKitGTK development package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev

      - name: Build the app in release mode
        run: cargo build --release --locked --package nefrita-app --features tauri/custom-protocol

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_DENY_VERSION: 0.20.2
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Restore cargo-deny
        id: cargo-deny-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ env.CARGO_DENY_VERSION }}-${{ runner.os }}

      - name: Install cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"

      - name: Check advisories, licenses, bans and sources
        run: cargo deny --locked check

  device-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIRMWARE_REPOSITORY: Sharmaz/Jade
      FIRMWARE_COMMIT: e18deffd96fb293730a51c9874c73ab4ca6e841a
      JADE_BUILDER_IMAGE: blockstream/jade_builder@sha256:cbf0aabee7513dc8cad8f1d69a5e00f5b73bcd0965a44254627c0de4bfc8c4f2
      LIBJADE_PORT: 30121
      PIN_SERVER_IMAGE: pin-server
      PIN_SERVER_IMAGE_ARCHIVE: ${{ github.workspace }}/pin-server-image.tar
      PIN_SERVER_CONTAINER_PORT: 8096
      DEVELOPMENT_PIN_SERVER_PORT: 8096
      CUSTOM_PIN_SERVER_PORT: 8097
      CUSTOM_PIN_SERVER_KEY_DIRECTORY: ${{ github.workspace }}/target/custom-pin-server
    steps:
      - uses: actions/checkout@v7

      - name: Check out the firmware
        uses: actions/checkout@v7
        with:
          repository: ${{ env.FIRMWARE_REPOSITORY }}
          ref: ${{ env.FIRMWARE_COMMIT }}
          path: firmware
          submodules: recursive

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Restore libjade_daemon
        id: libjade-daemon-cache
        uses: actions/cache@v6
        with:
          path: firmware/build_linux/libjade/libjade_daemon
          key: libjade-daemon-xbt-${{ env.FIRMWARE_COMMIT }}

      - name: Build libjade_daemon with XBT
        if: steps.libjade-daemon-cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm --volume "$PWD/firmware":/host/jade --workdir /host/jade \
            "$JADE_BUILDER_IMAGE" bash -c '
            git config --global --add safe.directory /host/jade &&
            pushd /opt/esp/idf >/dev/null && . ./export.sh >/dev/null && popd >/dev/null &&
            ./tools/switch_to.sh jade --dev --noradio &&
            ./libjade/make_libjade.sh Debug --xbt'

      - name: Start libjade_daemon
        run: |
          docker run --detach --name libjade-daemon --publish "$LIBJADE_PORT:$LIBJADE_PORT" \
            --volume "$PWD/firmware/build_linux/libjade":/libjade \
            "$JADE_BUILDER_IMAGE" /libjade/libjade_daemon --tcp "$LIBJADE_PORT"

      - name: Restore the PIN server image archive
        id: pin-server-image-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.PIN_SERVER_IMAGE_ARCHIVE }}
          key: pin-server-image-${{ env.FIRMWARE_COMMIT }}

      - name: Build the PIN server image and save its archive
        if: steps.pin-server-image-cache.outputs.cache-hit != 'true'
        run: |
          docker build --tag "$PIN_SERVER_IMAGE" firmware/pinserver
          docker save --output "$PIN_SERVER_IMAGE_ARCHIVE" "$PIN_SERVER_IMAGE"

      - name: Load the PIN server image
        if: steps.pin-server-image-cache.outputs.cache-hit == 'true'
        run: docker load --input "$PIN_SERVER_IMAGE_ARCHIVE"

      - name: Generate the custom PIN server key pair
        run: |
          mkdir -p "$CUSTOM_PIN_SERVER_KEY_DIRECTORY"
          docker run --rm --volume "$CUSTOM_PIN_SERVER_KEY_DIRECTORY":/keys --workdir /keys \
            --env PYTHONPATH=/ "$PIN_SERVER_IMAGE" python3 -m pinserver.generateserverkey

      - name: Start the PIN servers
        run: |
          docker run --detach --name development-pin-server \
            --publish "$DEVELOPMENT_PIN_SERVER_PORT:$PIN_SERVER_CONTAINER_PORT" --tmpfs /pins \
            --volume "$PWD/firmware/server_private_key.key":/server_private_key.key:ro \
            "$PIN_SERVER_IMAGE"
          docker run --detach --name custom-pin-server \
            --publish "$CUSTOM_PIN_SERVER_PORT:$PIN_SERVER_CONTAINER_PORT" --tmpfs /pins \
            --volume "$CUSTOM_PIN_SERVER_KEY_DIRECTORY/server_private_key.key":/server_private_key.key:ro \
            "$PIN_SERVER_IMAGE"

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Wait for the PIN servers
        run: |
          for pin_server_port in "$DEVELOPMENT_PIN_SERVER_PORT" "$CUSTOM_PIN_SERVER_PORT"; do
            curl --silent --fail --output /dev/null --retry 60 --retry-delay 1 \
              --retry-all-errors "http://localhost:$pin_server_port/"
          done

      - name: Run the integration tests
        timeout-minutes: 10
        env:
          NEFRITA_LIBJADE_ADDRESS: 127.0.0.1:${{ env.LIBJADE_PORT }}
          NEFRITA_CUSTOM_PIN_SERVER_URL: http://localhost:${{ env.CUSTOM_PIN_SERVER_PORT }}
          NEFRITA_CUSTOM_PIN_SERVER_PUBLIC_KEY_FILE: ${{ env.CUSTOM_PIN_SERVER_KEY_DIRECTORY }}/server_public_key.pub
        run: |
          cargo test --package nefrita-device --test libjade --features debug-methods --locked \
            -- --ignored --test-threads=1

      - name: Show the libjade_daemon output
        if: failure()
        run: docker logs libjade-daemon

      - name: Show the development PIN server output
        if: failure()
        run: docker logs development-pin-server

      - name: Show the custom PIN server output
        if: failure()
        run: docker logs custom-pin-server
