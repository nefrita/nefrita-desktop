name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FRONTEND_DIRECTORY: crates/nefrita-app/frontend

defaults:
  run:
    shell: bash

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all --check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install the WebKitGTK development package
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev

      - name: Run clippy with all features
        run: cargo clippy --workspace --all-targets --all-features --locked -- --deny warnings

      - name: Run clippy with default features
        run: cargo clippy --workspace --all-targets --locked -- --deny warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install the WebKitGTK development package
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Check that the TypeScript bindings match the Rust types
        run: |
          git status --porcelain -- "$FRONTEND_DIRECTORY/src/bindings"
          test -z "$(git status --porcelain -- "$FRONTEND_DIRECTORY/src/bindings")"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIRECTORY }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the Node version from package.json
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.FRONTEND_DIRECTORY }}/package.json

      - name: Install the pnpm version from package.json
        run: npm install --global --ignore-scripts "$(node --print "require('./package.json').packageManager")"

      - name: Install the frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint rules
        run: pnpm check-format-and-lint

      - name: Check types
        run: pnpm typecheck

      - name: Run the frontend tests
        run: pnpm test

      - name: Build the frontend
        run: pnpm build

      - name: Audit the dependencies that ship with the app
        run: pnpm audit --prod

  app-build:
    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install the WebKitGTK development package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev

      - name: Install the Node version from package.json
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.FRONTEND_DIRECTORY }}/package.json

      - name: Install the pnpm version from package.json
        working-directory: ${{ env.FRONTEND_DIRECTORY }}
        run: npm install --global --ignore-scripts "$(node --print "require('./package.json').packageManager")"

      - name: Install the frontend dependencies
        working-directory: ${{ env.FRONTEND_DIRECTORY }}
        run: pnpm install --frozen-lockfile

      - name: Build the frontend
        working-directory: ${{ env.FRONTEND_DIRECTORY }}
        run: pnpm build

      - name: Build the app in release mode
        env:
          AWS_LC_SYS_PREBUILT_NASM: 1
        run: cargo build --release --locked --package nefrita-app --features tauri/custom-protocol

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_DENY_VERSION: 0.20.2
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Restore cargo-deny
        id: cargo-deny-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ env.CARGO_DENY_VERSION }}-${{ runner.os }}

      - name: Install cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"

      - name: Check advisories, licenses, bans and sources
        run: cargo deny --locked check

  device-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIRMWARE_REPOSITORY: Sharmaz/Jade
      FIRMWARE_COMMIT: e18deffd96fb293730a51c9874c73ab4ca6e841a
      JADE_BUILDER_IMAGE: blockstream/jade_builder@sha256:cbf0aabee7513dc8cad8f1d69a5e00f5b73bcd0965a44254627c0de4bfc8c4f2
      LIBJADE_PORT: 30121
      PIN_SERVER_IMAGE: pin-server
      PIN_SERVER_IMAGE_ARCHIVE: ${{ github.workspace }}/pin-server-image.tar
      PIN_SERVER_CONTAINER_PORT: 8096
      DEVELOPMENT_PIN_SERVER_PORT: 8096
      CUSTOM_PIN_SERVER_PORT: 8097
      CUSTOM_PIN_SERVER_KEY_DIRECTORY: ${{ github.workspace }}/target/custom-pin-server
      CUSTOM_PIN_SERVER_GUIDE: docs/custom-pin-server.md
      GUIDE_BASH_BLOCKS_SCRIPT: .github/scripts/guide-bash-blocks.awk
      GUIDE_STARTING_SECTIONS: |-
        Prepare the shell
        Build the PIN server image
        Create the key pair of the PIN server
        Create the certificate authority
        Create the server certificate
        Write the nginx TLS configuration
        Start the PIN server
        Load the PIN server in the app
      GUIDE_RENEWAL_SECTIONS: |-
        Prepare the shell
        Create the server certificate
        Renew the server certificate
      GUIDE_CLOSING_SECTIONS: |-
        Prepare the shell
        Back up the PIN server
        Stop and start the PIN server
    steps:
      - uses: actions/checkout@v7

      - name: Check out the firmware
        uses: actions/checkout@v7
        with:
          repository: ${{ env.FIRMWARE_REPOSITORY }}
          ref: ${{ env.FIRMWARE_COMMIT }}
          path: firmware
          submodules: recursive

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Restore libjade_daemon
        id: libjade-daemon-cache
        uses: actions/cache@v6
        with:
          path: firmware/build_linux/libjade/libjade_daemon
          key: libjade-daemon-xbt-${{ env.FIRMWARE_COMMIT }}

      - name: Build libjade_daemon with XBT
        if: steps.libjade-daemon-cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm --volume "$PWD/firmware":/host/jade --workdir /host/jade \
            "$JADE_BUILDER_IMAGE" bash -c '
            git config --global --add safe.directory /host/jade &&
            pushd /opt/esp/idf >/dev/null && . ./export.sh >/dev/null && popd >/dev/null &&
            ./tools/switch_to.sh jade --dev --noradio &&
            ./libjade/make_libjade.sh Debug --xbt'

      - name: Start libjade_daemon
        run: |
          docker run --detach --name libjade-daemon --publish "$LIBJADE_PORT:$LIBJADE_PORT" \
            --volume "$PWD/firmware/build_linux/libjade":/libjade \
            "$JADE_BUILDER_IMAGE" /libjade/libjade_daemon --tcp "$LIBJADE_PORT"

      - name: Restore the PIN server image archive
        id: pin-server-image-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.PIN_SERVER_IMAGE_ARCHIVE }}
          key: pin-server-image-${{ env.FIRMWARE_COMMIT }}

      - name: Build the PIN server image and save its archive
        if: steps.pin-server-image-cache.outputs.cache-hit != 'true'
        run: |
          docker build --tag "$PIN_SERVER_IMAGE" firmware/pinserver
          docker save --output "$PIN_SERVER_IMAGE_ARCHIVE" "$PIN_SERVER_IMAGE"

      - name: Load the PIN server image
        if: steps.pin-server-image-cache.outputs.cache-hit == 'true'
        run: docker load --input "$PIN_SERVER_IMAGE_ARCHIVE"

      - name: Generate the custom PIN server key pair
        run: |
          mkdir -p "$CUSTOM_PIN_SERVER_KEY_DIRECTORY"
          docker run --rm --volume "$CUSTOM_PIN_SERVER_KEY_DIRECTORY":/keys --workdir /keys \
            --env PYTHONPATH=/ "$PIN_SERVER_IMAGE" python3 -m pinserver.generateserverkey

      - name: Start the PIN servers
        run: |
          docker run --detach --name development-pin-server \
            --publish "$DEVELOPMENT_PIN_SERVER_PORT:$PIN_SERVER_CONTAINER_PORT" --tmpfs /pins \
            --volume "$PWD/firmware/server_private_key.key":/server_private_key.key:ro \
            "$PIN_SERVER_IMAGE"
          docker run --detach --name custom-pin-server \
            --publish "$CUSTOM_PIN_SERVER_PORT:$PIN_SERVER_CONTAINER_PORT" --tmpfs /pins \
            --volume "$CUSTOM_PIN_SERVER_KEY_DIRECTORY/server_private_key.key":/server_private_key.key:ro \
            "$PIN_SERVER_IMAGE"

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Wait for the PIN servers
        run: |
          for pin_server_port in "$DEVELOPMENT_PIN_SERVER_PORT" "$CUSTOM_PIN_SERVER_PORT"; do
            curl --silent --fail --output /dev/null --retry 60 --retry-delay 1 \
              --retry-all-errors "http://localhost:$pin_server_port/"
          done

      - name: Check the custom PIN server guide and extract the sections that the job runs
        run: |
          grep --quiet --line-regexp "firmware_commit=$FIRMWARE_COMMIT" "$CUSTOM_PIN_SERVER_GUIDE"
          awk -v list_sections_with_bash_blocks=1 -f "$GUIDE_BASH_BLOCKS_SCRIPT" \
            "$CUSTOM_PIN_SERVER_GUIDE" | sort > "$RUNNER_TEMP/guide-sections-with-bash-blocks"
          printf '%s\n' "$GUIDE_STARTING_SECTIONS" "$GUIDE_RENEWAL_SECTIONS" \
            "$GUIDE_CLOSING_SECTIONS" | sort --unique > "$RUNNER_TEMP/guide-sections-that-run"
          diff "$RUNNER_TEMP/guide-sections-with-bash-blocks" "$RUNNER_TEMP/guide-sections-that-run"
          extract_guide_sections() {
            GUIDE_SECTIONS="$1" awk -f "$GUIDE_BASH_BLOCKS_SCRIPT" "$CUSTOM_PIN_SERVER_GUIDE" > "$2"
          }
          extract_guide_sections "Prepare the shell" "$RUNNER_TEMP/guide-shell-preparation.sh"
          extract_guide_sections "$GUIDE_STARTING_SECTIONS" "$RUNNER_TEMP/guide-starting-sections.sh"
          extract_guide_sections "$GUIDE_RENEWAL_SECTIONS" "$RUNNER_TEMP/guide-renewal-sections.sh"
          extract_guide_sections "$GUIDE_CLOSING_SECTIONS" "$RUNNER_TEMP/guide-closing-sections.sh"

      - name: Start the TLS PIN server, following the custom PIN server guide
        run: bash -e "$RUNNER_TEMP/guide-starting-sections.sh"

      - name: Pass the URL and the files of the TLS PIN server to the integration tests
        run: |
          source "$RUNNER_TEMP/guide-shell-preparation.sh"
          {
            echo "NEFRITA_TLS_PIN_SERVER_URL=$pin_server_url"
            echo "NEFRITA_TLS_PIN_SERVER_PUBLIC_KEY_FILE=$pin_server_key_pair_directory/server_public_key.pub"
            echo "NEFRITA_TLS_PIN_SERVER_ROOT_CERTIFICATE_FILE=$certificate_authority_directory/certificate.pem"
          } >> "$GITHUB_ENV"

      - name: Run the integration tests
        timeout-minutes: 10
        env:
          NEFRITA_LIBJADE_ADDRESS: 127.0.0.1:${{ env.LIBJADE_PORT }}
          NEFRITA_CUSTOM_PIN_SERVER_URL: http://localhost:${{ env.CUSTOM_PIN_SERVER_PORT }}
          NEFRITA_CUSTOM_PIN_SERVER_PUBLIC_KEY_FILE: ${{ env.CUSTOM_PIN_SERVER_KEY_DIRECTORY }}/server_public_key.pub
        run: |
          cargo test --package nefrita-device --test libjade --features debug-methods --locked \
            -- --ignored --test-threads=1

      - name: Renew the server certificate of the TLS PIN server, following the guide
        run: bash -e "$RUNNER_TEMP/guide-renewal-sections.sh"

      - name: Run the test of the TLS PIN server with the renewed server certificate
        timeout-minutes: 5
        env:
          NEFRITA_LIBJADE_ADDRESS: 127.0.0.1:${{ env.LIBJADE_PORT }}
        run: |
          cargo test --package nefrita-device --test libjade --features debug-methods --locked \
            -- --ignored --exact pin_wallet_is_created_and_unlocked_with_the_tls_pin_server

      - name: Back up, stop and start the TLS PIN server, following the guide
        run: bash -e "$RUNNER_TEMP/guide-closing-sections.sh"

      - name: Show the libjade_daemon output
        if: failure()
        run: docker logs libjade-daemon

      - name: Show the development PIN server output
        if: failure()
        run: docker logs development-pin-server

      - name: Show the custom PIN server output
        if: failure()
        run: docker logs custom-pin-server

      - name: Show the TLS PIN server output
        if: failure()
        run: docker logs nefrita-pin-server
