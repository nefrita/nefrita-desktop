name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_DENY_VERSION: 0.20.2

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all --check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- --deny warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Run tests
        run: cargo test --workspace --all-features --locked

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Restore cargo-deny
        id: cargo-deny-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ env.CARGO_DENY_VERSION }}-${{ runner.os }}

      - name: Install cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"

      - name: Check advisories, licenses, bans and sources
        run: cargo deny --locked check
